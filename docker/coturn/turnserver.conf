# Minimal coturn configuration for CodeSync.
#
# Set TURN_SECRET in the environment; Coturn uses it as a shared secret.
# In production add TLS (cert/pkey) and a real realm, and set external-ip to
# the public address of the host so relay candidates are reachable.

listening-port=3478
# tls-listening-port=5349

# Use the REST/shared-secret credential model. The application generates a
# short-lived HMAC credential; TURN_SECRET itself is never sent to browsers.
use-auth-secret
realm=codesync

min-port=49160
max-port=49200

fingerprint
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers

# Behind 1:1 NAT (cloud VM) uncomment and set your public address:
# external-ip=203.0.113.10
# With a private + public pair: external-ip=10.0.0.5/203.0.113.10

# TLS termination for wss/turns deployments:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

log-file=stdout
simple-log
