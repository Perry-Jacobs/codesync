name: Deploy CodeSync Frontend Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codesync-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CODE_SYNC_API_ORIGIN: https://codesync-api.sallydon164.workers.dev
      NEXT_PUBLIC_API_URL: https://codesync-api.sallydon164.workers.dev
      NEXT_PUBLIC_WS_URL: wss://codesync-api.sallydon164.workers.dev/ws
      NEXT_PUBLIC_APP_URL: https://codesync.sallydon164.workers.dev
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CODE_SYNC_API_ORIGIN"
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$NEXT_PUBLIC_WS_URL"
          test -n "$NEXT_PUBLIC_APP_URL"
          case "$CODE_SYNC_API_ORIGIN" in
            https://codesync-api.sallydon164.workers.dev) ;;
            *) exit 1 ;;
          esac
          case "$NEXT_PUBLIC_API_URL" in
            https://codesync-api.sallydon164.workers.dev) ;;
            *) exit 1 ;;
          esac
          case "$NEXT_PUBLIC_WS_URL" in
            wss://codesync-api.sallydon164.workers.dev/ws) ;;
            *) exit 1 ;;
          esac
          case "$NEXT_PUBLIC_APP_URL" in
            https://codesync.sallydon164.workers.dev) ;;
            *) exit 1 ;;
          esac

      - name: Build and deploy frontend Worker
        run: npm run cf:deploy
