name: Deploy CodeSync API Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codesync-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: workers/codesync/package-lock.json

      - name: Show Node.js version
        run: node --version

      - name: Install Worker dependencies
        working-directory: workers/codesync
        run: npm ci

      - name: Type-check Worker
        working-directory: workers/codesync
        run: npm run check

      - name: Validate deployment configuration
        working-directory: workers/codesync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_ORIGINS: https://codesync.sallydon164.workers.dev
          PUBLIC_APP_URL: https://codesync.sallydon164.workers.dev
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ALLOWED_ORIGINS"
          test -n "$PUBLIC_APP_URL"
          case "$ALLOWED_ORIGINS" in
            http://localhost:*|https://localhost:*|*future*|*example*|*" "*) exit 1 ;;
          esac
          case "$PUBLIC_APP_URL" in
            http://localhost:*|https://localhost:*|*future*|*example*|*" "*) exit 1 ;;
          esac
          case "$ALLOWED_ORIGINS" in
            https://*|http://*) ;;
            *) exit 1 ;;
          esac
          case "$PUBLIC_APP_URL" in
            https://*|http://*) ;;
            *) exit 1 ;;
          esac

      - name: Deploy Worker
        working-directory: workers/codesync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_ORIGINS: https://codesync.sallydon164.workers.dev
          PUBLIC_APP_URL: https://codesync.sallydon164.workers.dev
        run: >-
          npx wrangler deploy
          --var ALLOWED_ORIGINS:$ALLOWED_ORIGINS
          --var PUBLIC_APP_URL:$PUBLIC_APP_URL
