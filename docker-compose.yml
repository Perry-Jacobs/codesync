# CodeSync — Redis-backed collaborative code sessions with voice/video.
#
# The app runs one Node process that serves Next.js and the WebSocket
# gateway on :3000. Redis is the only datastore in v1.
# Set APP_REDIS_URL to use a managed/external Redis instance.
#
#   cp .env.example .env      # then edit JWT_SECRET at minimum
#   docker compose up --build
#
# NEXT_PUBLIC_* values are baked into the client bundle, so changing them
# requires `docker compose build` again.

name: codesync

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  # Redis stays on the private Compose network. Use an override file if you
  # need direct local access while debugging.

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3000/ws}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3000
      REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-codesync:}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-1}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-8}
      RATE_LIMIT_MSGS_PER_SEC: ${RATE_LIMIT_MSGS_PER_SEC:-60}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      TURN_SERVER: ${TURN_SERVER:-turn:localhost:3478}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env (32+ characters)}
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.l.google.com:19302}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "3000:3000"

  turn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env (32+ characters)}"
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  redis-data:
